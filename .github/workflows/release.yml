name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Stage tool trust root
        env:
          TOOL_PUBLIC_KEY: ${{ secrets.JAVASHIELD_TOOL_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$TOOL_PUBLIC_KEY" ]; then
            mkdir -p root-keys
            printf '%s\n' "$TOOL_PUBLIC_KEY" > root-keys/root.pub
          fi

      - name: Build and test
        env:
          TOOL_PUBLIC_KEY: ${{ secrets.JAVASHIELD_TOOL_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$TOOL_PUBLIC_KEY" ]; then
            mvn -B -ntp -Pembedded-tool-key clean package
            unzip -l javashield-cli/target/javashield.jar \
              | grep -q 'com/javashield/tool/root.pub'
          else
            echo "::warning::JAVASHIELD_TOOL_PUBLIC_KEY is not set; the release will not embed a tool trust root"
            mvn -B -ntp clean package
          fi

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp javashield-cli/target/javashield.jar out/
          cp javashield-agent/target/javashield-agent-*-agent.jar out/jshield-agent.jar
          cp javashield-maven-plugin/target/javashield-maven-plugin-*.jar out/
          ls -lh out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-manual-$(date +%Y%m%d%H%M)}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --generate-notes
          fi
